<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rainfall Prediction</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="login">
    <div class="icon">&#127783;&#65039;</div>
    <center>
        <h1>Rainfall Prediction</h1>
        <p class="subtitle">Enter the weather details below to know the chances of rain in your location.</p>
    </center>

    <!-- Main Input For Receiving Query to our ML -->
    <form action="{{ url_for('predict') }}" method="post">
        <div class="grid">

            <div class="field">
                <label for="Location">Location</label>
                <select id="Location" name="Location" required>
                    <option value="" disabled selected>Select location</option>
                    <option value="0">Adelaide</option>
                    <option value="1">Albany</option>
                    <option value="2">Albury</option>
                    <option value="3">AliceSprings</option>
                    <option value="4">BadgerysCreek</option>
                    <option value="5">Ballarat</option>
                    <option value="6">Bendigo</option>
                    <option value="7">Brisbane</option>
                    <option value="8">Cairns</option>
                    <option value="9">Canberra</option>
                    <option value="10">Cobar</option>
                    <option value="11">CoffsHarbour</option>
                    <option value="12">Dartmoor</option>
                    <option value="13">Darwin</option>
                    <option value="14">GoldCoast</option>
                    <option value="15">Hobart</option>
                    <option value="16">Katherine</option>
                    <option value="17">Launceston</option>
                    <option value="18">Melbourne</option>
                    <option value="19">MelbourneAirport</option>
                    <option value="20">Mildura</option>
                    <option value="21">Moree</option>
                    <option value="22">MountGambier</option>
                    <option value="23">MountGinini</option>
                    <option value="24">Newcastle</option>
                    <option value="25">Nhil</option>
                    <option value="26">NorahHead</option>
                    <option value="27">NorfolkIsland</option>
                    <option value="28">Nuriootpa</option>
                    <option value="29">PearceRAAF</option>
                    <option value="30">Penrith</option>
                    <option value="31">Perth</option>
                    <option value="32">PerthAirport</option>
                    <option value="33">Portland</option>
                    <option value="34">Richmond</option>
                    <option value="35">Sale</option>
                    <option value="36">SalmonGums</option>
                    <option value="37">Sydney</option>
                    <option value="38">SydneyAirport</option>
                    <option value="39">Townsville</option>
                    <option value="40">Tuggeranong</option>
                    <option value="41">Uluru</option>
                    <option value="42">WaggaWagga</option>
                    <option value="43">Walpole</option>
                    <option value="44">Watsonia</option>
                    <option value="45">Williamtown</option>
                    <option value="46">Witchcliffe</option>
                    <option value="47">Wollongong</option>
                    <option value="48">Woomera</option>
                </select>
            </div>

            <div class="field">
                <label for="MinTemp">Min Temp (&deg;C)</label>
                <input type="number" step="any" id="MinTemp" name="MinTemp" placeholder="Enter minimum temperature" required>
            </div>

            <div class="field">
                <label for="MaxTemp">Max Temp (&deg;C)</label>
                <input type="number" step="any" id="MaxTemp" name="MaxTemp" placeholder="Enter maximum temperature" required>
            </div>

            <div class="field">
                <label for="Rainfall">Rainfall (mm)</label>
                <input type="number" step="any" id="Rainfall" name="Rainfall" placeholder="Enter rainfall" required>
            </div>

            <div class="field">
                <label for="Evaporation">Evaporation (mm)</label>
                <input type="number" step="any" id="Evaporation" name="Evaporation" placeholder="Enter evaporation" required>
            </div>

            <div class="field">
                <label for="Sunshine">Sunshine (hours)</label>
                <input type="number" step="any" id="Sunshine" name="Sunshine" placeholder="Enter sunshine hours" required>
            </div>

            <div class="field">
                <label for="WindGustDir">Wind Gust Direction</label>
                <select id="WindGustDir" name="WindGustDir" required>
                    <option value="" disabled selected>Select direction</option>
                    <option value="0">E</option>
                    <option value="1">ENE</option>
                    <option value="2">ESE</option>
                    <option value="3">N</option>
                    <option value="4">NE</option>
                    <option value="5">NNE</option>
                    <option value="6">NNW</option>
                    <option value="7">NW</option>
                    <option value="8">S</option>
                    <option value="9">SE</option>
                    <option value="10">SSE</option>
                    <option value="11">SSW</option>
                    <option value="12">SW</option>
                    <option value="13">W</option>
                    <option value="14">WNW</option>
                    <option value="15">WSW</option>
                </select>
            </div>

            <div class="field">
                <label for="WindGustSpeed">Wind Gust Speed (km/h)</label>
                <input type="number" step="any" id="WindGustSpeed" name="WindGustSpeed" placeholder="Enter wind gust speed" required>
            </div>

            <div class="field">
                <label for="WindDir9am">Wind Direction 9am</label>
                <select id="WindDir9am" name="WindDir9am" required>
                    <option value="" disabled selected>Select direction</option>
                    <option value="0">E</option>
                    <option value="1">ENE</option>
                    <option value="2">ESE</option>
                    <option value="3">N</option>
                    <option value="4">NE</option>
                    <option value="5">NNE</option>
                    <option value="6">NNW</option>
                    <option value="7">NW</option>
                    <option value="8">S</option>
                    <option value="9">SE</option>
                    <option value="10">SSE</option>
                    <option value="11">SSW</option>
                    <option value="12">SW</option>
                    <option value="13">W</option>
                    <option value="14">WNW</option>
                    <option value="15">WSW</option>
                </select>
            </div>

            <div class="field">
                <label for="WindDir3pm">Wind Direction 3pm</label>
                <select id="WindDir3pm" name="WindDir3pm" required>
                    <option value="" disabled selected>Select direction</option>
                    <option value="0">E</option>
                    <option value="1">ENE</option>
                    <option value="2">ESE</option>
                    <option value="3">N</option>
                    <option value="4">NE</option>
                    <option value="5">NNE</option>
                    <option value="6">NNW</option>
                    <option value="7">NW</option>
                    <option value="8">S</option>
                    <option value="9">SE</option>
                    <option value="10">SSE</option>
                    <option value="11">SSW</option>
                    <option value="12">SW</option>
                    <option value="13">W</option>
                    <option value="14">WNW</option>
                    <option value="15">WSW</option>
                </select>
            </div>

            <div class="field">
                <label for="WindSpeed9am">Wind Speed 9am (km/h)</label>
                <input type="number" step="any" id="WindSpeed9am" name="WindSpeed9am" placeholder="Enter wind speed" required>
            </div>

            <div class="field">
                <label for="WindSpeed3pm">Wind Speed 3pm (km/h)</label>
                <input type="number" step="any" id="WindSpeed3pm" name="WindSpeed3pm" placeholder="Enter wind speed" required>
            </div>

            <div class="field">
                <label for="Humidity9am">Humidity 9am (%)</label>
                <input type="number" step="any" id="Humidity9am" name="Humidity9am" placeholder="Enter humidity" required>
            </div>

            <div class="field">
                <label for="Humidity3pm">Humidity 3pm (%)</label>
                <input type="number" step="any" id="Humidity3pm" name="Humidity3pm" placeholder="Enter humidity" required>
            </div>

            <div class="field">
                <label for="Pressure9am">Pressure 9am (hPa)</label>
                <input type="number" step="any" id="Pressure9am" name="Pressure9am" placeholder="Enter pressure" required>
            </div>

            <div class="field">
                <label for="Pressure3pm">Pressure 3pm (hPa)</label>
                <input type="number" step="any" id="Pressure3pm" name="Pressure3pm" placeholder="Enter pressure" required>
            </div>

            <div class="field">
                <label for="Cloud9am">Cloud 9am (oktas)</label>
                <input type="number" step="any" id="Cloud9am" name="Cloud9am" placeholder="Enter cloud cover" required>
            </div>

            <div class="field">
                <label for="Cloud3pm">Cloud 3pm (oktas)</label>
                <input type="number" step="any" id="Cloud3pm" name="Cloud3pm" placeholder="Enter cloud cover" required>
            </div>

            <div class="field">
                <label for="Temp9am">Temp 9am (&deg;C)</label>
                <input type="number" step="any" id="Temp9am" name="Temp9am" placeholder="Enter temperature" required>
            </div>

            <div class="field">
                <label for="Temp3pm">Temp 3pm (&deg;C)</label>
                <input type="number" step="any" id="Temp3pm" name="Temp3pm" placeholder="Enter temperature" required>
            </div>

            <div class="field">
                <label for="RainToday">Rain Today</label>
                <select id="RainToday" name="RainToday" required>
                    <option value="" disabled selected>Select option</option>
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

        </div>

        <button type="submit"><span class="btn-icon">&#9925;</span> Predict</button>
    </form>
</div>

<script src="/script.js"></script>
</body>
</html>
